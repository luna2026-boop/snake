<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>🐍 贪吃蛇</title>
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #1e293b;
    --board: rgba(148, 163, 184, 0.06);
    --grid: rgba(148, 163, 184, 0.05);
    --snake: #34d399;
    --snake-dark: #059669;
    --head: #6ee7b7;
    --food: #fb7185;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #22c55e;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(34, 197, 94, 0.12), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    user-select: none;
    -webkit-user-select: none;
  }

  #app {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 520px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    padding: 14px 16px 6px;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .hud-buttons { display: flex; gap: 8px; }

  .hud-buttons button {
    width: 36px;
    height: 36px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.15s, transform 0.1s;
  }
  .hud-buttons button:active { transform: scale(0.92); }
  .hud-buttons button.on {
    background: rgba(34, 197, 94, 0.22);
    border-color: rgba(34, 197, 94, 0.5);
  }

  .score-row {
    display: flex;
    gap: 18px;
    margin-top: 8px;
    font-size: 14px;
    color: var(--text-dim);
  }
  .score-row b { color: var(--text); font-variant-numeric: tabular-nums; }
  .score-row .best b { color: #fbbf24; }

  .board-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 8px;
  }

  #board {
    background: var(--board);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(148, 163, 184, 0.12);
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 16px;
    z-index: 5;
    padding: 20px;
    transition: opacity 0.2s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay .emoji { font-size: 52px; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; color: var(--text-dim); font-size: 14px; line-height: 1.6; }
  .overlay .final-score { font-size: 34px; font-weight: 800; color: var(--snake); }

  .btn {
    border: none;
    border-radius: 14px;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #052e16;
    background: linear-gradient(180deg, #4ade80, #22c55e);
    box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .btn:active { transform: scale(0.96); }

  .key-hint {
    font-size: 12px;
    color: var(--text-dim);
  }
  .key-hint kbd {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-bottom-width: 2px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    font-family: inherit;
    margin: 0 1px;
  }

  .controls {
    padding: 10px 16px 18px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dpad {
    display: none;
    grid-template-areas:
      ". up ."
      "left . right"
      ". down .";
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 6px;
  }
  body.touch .dpad { display: grid; }

  .dpad button {
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    display: grid;
    place-items: center;
    touch-action: none;
    transition: background 0.1s, transform 0.05s;
  }
  .dpad button:active { background: rgba(34, 197, 94, 0.25); transform: scale(0.94); }
  .dpad .up { grid-area: up; }
  .dpad .down { grid-area: down; }
  .dpad .left { grid-area: left; }
  .dpad .right { grid-area: right; }

  .desktop-hint { display: none; text-align: center; }
  body:not(.touch) .desktop-hint { display: block; }

  @media (max-height: 640px) {
    .dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="title-row">
        <h1>🐍 贪吃蛇</h1>
        <div class="hud-buttons">
          <button id="btn-sound" title="音效" aria-label="音效">🔊</button>
          <button id="btn-wrap" title="穿墙模式" aria-label="穿墙模式">🧱</button>
          <button id="btn-pause" title="暂停" aria-label="暂停">⏸️</button>
        </div>
      </div>
      <div class="score-row">
        <span class="score">得分 <b id="score">0</b></span>
        <span class="best">最高 <b id="best">0</b></span>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board"></canvas>

      <div class="overlay" id="overlay-ready">
        <div class="emoji">🐍</div>
        <h2>贪吃蛇</h2>
        <p class="key-hint">
          <span class="desktop-hint">
            方向键 / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动<br>
            <kbd>空格</kbd> 暂停
          </span>
          <span class="touch-hint">滑动屏幕或使用方向按钮控制</span>
        </p>
        <button class="btn" id="btn-start">开始游戏</button>
      </div>

      <div class="overlay hidden" id="overlay-over">
        <div class="emoji">💥</div>
        <h2>游戏结束</h2>
        <div class="final-score" id="final-score">0</div>
        <p id="new-best" class="hidden">🎉 新纪录!</p>
        <button class="btn" id="btn-restart">再来一局</button>
      </div>

      <div class="overlay hidden" id="overlay-pause">
        <div class="emoji">⏸️</div>
        <h2>已暂停</h2>
        <button class="btn" id="btn-resume">继续</button>
      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="right" data-dir="right">▶</button>
        <button class="down" data-dir="down">▼</button>
      </div>
      <div class="desktop-hint key-hint">方向键 / WASD 移动 · 空格暂停 · R 重开</div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- 常量 ----------
  const COLS = 21;
  const ROWS = 21;
  const DIRS = {
    up:    { x: 0, y: -1 },
    down:  { x: 0, y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };

  // ---------- DOM ----------
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const finalScoreEl = document.getElementById("final-score");
  const newBestEl = document.getElementById("new-best");
  const overlayReady = document.getElementById("overlay-ready");
  const overlayOver = document.getElementById("overlay-over");
  const overlayPause = document.getElementById("overlay-pause");
  const btnPause = document.getElementById("btn-pause");
  const btnSound = document.getElementById("btn-sound");
  const btnWrap = document.getElementById("btn-wrap");
  const boardWrap = document.querySelector(".board-wrap");

  // ---------- 状态 ----------
  let snake = [];
  let food = { x: 5, y: 5 };
  let currentDir = DIRS.right;
  let pendingDirs = [];
  let score = 0;
  let best = 0;
  let state = "ready"; // ready | playing | paused | over
  let cellSize = 20;
  let wrapMode = false;
  let muted = false;
  let acc = 0;
  let lastTime = 0;
  let newRecord = false;

  try { best = parseInt(localStorage.getItem("snake-best") || "0", 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // ---------- 音效 ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type = "square", vol = 0.05) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  const eatSound = () => { beep(520, 0.07); beep(780, 0.09, "square", 0.05); };
  const dieSound = () => { beep(320, 0.22, "sawtooth", 0.06); beep(160, 0.35, "sawtooth", 0.05); };

  // ---------- 画布尺寸 ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const availW = boardWrap.clientWidth - 16;
    const availH = boardWrap.clientHeight - 16;
    cellSize = Math.max(8, Math.floor(Math.min(availW / COLS, availH / ROWS)));
    const w = cellSize * COLS;
    const h = cellSize * ROWS;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- 游戏逻辑 ----------
  function resetSnake() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    currentDir = DIRS.right;
    pendingDirs = [];
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.y * COLS + s.x));
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!occupied.has(y * COLS + x)) free.push({ x, y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : { x: 0, y: 0 };
  }

  function setDirection(dir) {
    const ref = pendingDirs.length ? pendingDirs[pendingDirs.length - 1] : currentDir;
    const same = dir.x === ref.x && dir.y === ref.y;
    const reverse = dir.x === -ref.x && dir.y === -ref.y;
    if (same || reverse) return;
    if (pendingDirs.length < 3) pendingDirs.push(dir);
  }

  function moveInterval() {
    return Math.max(65, 150 - score * 4);
  }

  function step() {
    if (pendingDirs.length) currentDir = pendingDirs.shift();
    const head = snake[0];
    let nx = head.x + currentDir.x;
    let ny = head.y + currentDir.y;

    if (wrapMode) {
      nx = (nx + COLS) % COLS;
      ny = (ny + ROWS) % ROWS;
    } else if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
      return gameOver();
    }

    const willEat = nx === food.x && ny === food.y;
    // 不吃食物时蛇尾会移动，因此碰撞检测可排除最后一节
    const limit = snake.length - (willEat ? 0 : 1);
    for (let i = 0; i < limit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) return gameOver();
    }

    snake.unshift({ x: nx, y: ny });
    if (willEat) {
      score++;
      scoreEl.textContent = score;
      placeFood();
      eatSound();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = "over";
    dieSound();
    newRecord = score > best;
    if (newRecord) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("snake-best", String(best)); } catch (e) {}
    }
    finalScoreEl.textContent = score;
    newBestEl.classList.toggle("hidden", !newRecord);
    show(overlayOver);
    btnPause.textContent = "⏸️";
  }

  function startGame() {
    resetSnake();
    score = 0;
    scoreEl.textContent = score;
    placeFood();
    state = "playing";
    acc = 0;
    lastTime = performance.now();
    hide(overlayReady);
    hide(overlayOver);
    hide(overlayPause);
    btnPause.textContent = "⏸️";
  }

  function togglePause() {
    if (state === "playing") {
      state = "paused";
      show(overlayPause);
      btnPause.textContent = "▶️";
    } else if (state === "paused") {
      resume();
    }
  }

  function resume() {
    state = "playing";
    lastTime = performance.now();
    acc = 0;
    hide(overlayPause);
    btnPause.textContent = "⏸️";
  }

  function show(el) { el.classList.remove("hidden"); }
  function hide(el) { el.classList.add("hidden"); }

  // ---------- 绘制 ----------
  function centerOf(cell) {
    return { x: cell.x * cellSize + cellSize / 2, y: cell.y * cellSize + cellSize / 2 };
  }

  function draw() {
    // 网格
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0b1120";
    ctx.fillRect(0, 0, cellSize * COLS, cellSize * ROWS);

    ctx.strokeStyle = "rgba(148,163,184,0.05)";
    ctx.lineWidth = 1;
    for (let x = 1; x < COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * cellSize + 0.5, 0);
      ctx.lineTo(x * cellSize + 0.5, cellSize * ROWS);
      ctx.stroke();
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * cellSize + 0.5);
      ctx.lineTo(cellSize * COLS, y * cellSize + 0.5);
      ctx.stroke();
    }

    // 食物
    const fc = centerOf(food);
    const pulse = 0.85 + 0.15 * Math.sin(performance.now() / 180);
    ctx.save();
    ctx.shadowColor = "rgba(251,113,133,0.8)";
    ctx.shadowBlur = cellSize * 0.6;
    const grad = ctx.createRadialGradient(fc.x, fc.y, 1, fc.x, fc.y, cellSize * 0.5 * pulse);
    grad.addColorStop(0, "#fda4af");
    grad.addColorStop(1, "#e11d48");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fc.x, fc.y, cellSize * 0.34 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 蛇身（圆角连线）
    if (snake.length) {
      ctx.save();
      ctx.strokeStyle = "#34d399";
      ctx.lineWidth = cellSize * 0.72;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(52,211,153,0.4)";
      ctx.shadowBlur = cellSize * 0.4;
      ctx.beginPath();
      snake.forEach((seg, i) => {
        const c = centerOf(seg);
        if (i === 0) ctx.moveTo(c.x, c.y);
        else ctx.lineTo(c.x, c.y);
      });
      ctx.stroke();
      ctx.restore();

      // 蛇头
      const head = centerOf(snake[0]);
      const dx = currentDir.x, dy = currentDir.y;
      const px = -dy, py = dx; // 垂直于前进方向
      ctx.save();
      ctx.fillStyle = "#6ee7b7";
      ctx.shadowColor = "rgba(110,231,183,0.6)";
      ctx.shadowBlur = cellSize * 0.4;
      ctx.beginPath();
      ctx.arc(head.x, head.y, cellSize * 0.46, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 眼睛
      const f = cellSize * 0.22, s = cellSize * 0.18;
      const ex1 = { x: head.x + dx * f + px * s, y: head.y + dy * f + py * s };
      const ex2 = { x: head.x + dx * f - px * s, y: head.y + dy * f - py * s };
      ctx.fillStyle = "#fff";
      for (const e of [ex1, ex2]) {
        ctx.beginPath();
        ctx.arc(e.x, e.y, cellSize * 0.13, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#0f172a";
      for (const e of [ex1, ex2]) {
        ctx.beginPath();
        ctx.arc(e.x + dx * cellSize * 0.03, e.y + dy * cellSize * 0.03, cellSize * 0.065, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---------- 主循环 ----------
  function loop(t) {
    const dt = t - lastTime;
    lastTime = t;
    if (state === "playing") {
      acc += dt;
      const interval = moveInterval();
      while (acc >= interval) {
        acc -= interval;
        step();
        if (state !== "playing") break;
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  function handleKey(e) {
    const k = e.key.toLowerCase();
    const dirMap = {
      arrowup: DIRS.up, w: DIRS.up,
      arrowdown: DIRS.down, s: DIRS.down,
      arrowleft: DIRS.left, a: DIRS.left,
      arrowright: DIRS.right, d: DIRS.right,
    };
    if (dirMap[k]) {
      e.preventDefault();
      ensureAudio();
      if (state === "playing") setDirection(dirMap[k]);
      else if (state === "ready") startGame();
      return;
    }
    if (k === " " || k === "spacebar") {
      e.preventDefault();
      ensureAudio();
      if (state === "playing") togglePause();
      else if (state === "paused") resume();
      else if (state === "ready" || state === "over") startGame();
      return;
    }
    if (k === "p") { togglePause(); return; }
    if (k === "r" || k === "enter") {
      if (state === "over" || state === "ready") startGame();
      return;
    }
  }

  // 滑动手势
  let touchStart = null;
  const SWIPE = 24;
  function onTouchStart(e) {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }
  function onTouchMove(e) {
    if (!touchStart) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < SWIPE && Math.abs(dy) < SWIPE) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? DIRS.right : DIRS.left);
    else setDirection(dy > 0 ? DIRS.down : DIRS.up);
    touchStart = { x: t.clientX, y: t.clientY };
  }
  function onTouchEnd() { touchStart = null; }

  // ---------- 事件绑定 ----------
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 100));
  window.addEventListener("keydown", handleKey);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "playing") togglePause();
  });

  document.getElementById("btn-start").addEventListener("click", () => { ensureAudio(); startGame(); });
  document.getElementById("btn-restart").addEventListener("click", () => { ensureAudio(); startGame(); });
  document.getElementById("btn-resume").addEventListener("click", () => { ensureAudio(); resume(); });
  btnPause.addEventListener("click", () => { ensureAudio(); togglePause(); });

  btnSound.addEventListener("click", () => {
    ensureAudio();
    muted = !muted;
    btnSound.textContent = muted ? "🔇" : "🔊";
    btnSound.classList.toggle("on", !muted);
  });
  btnWrap.addEventListener("click", () => {
    wrapMode = !wrapMode;
    btnWrap.textContent = wrapMode ? "🟢" : "🧱";
    btnWrap.classList.toggle("on", wrapMode);
  });

  // 方向按钮
  document.querySelectorAll(".dpad button").forEach(btn => {
    btn.addEventListener("pointerdown", e => {
      e.preventDefault();
      ensureAudio();
      if (state === "ready") startGame();
      setDirection(DIRS[btn.dataset.dir]);
    });
  });

  // 触摸 / 滑动
  canvas.addEventListener("touchstart", e => { e.preventDefault(); onTouchStart(e); }, { passive: false });
  canvas.addEventListener("touchmove", e => { e.preventDefault(); onTouchMove(e); }, { passive: false });
  canvas.addEventListener("touchend", onTouchEnd);
  canvas.addEventListener("touchcancel", onTouchEnd);

  // 检测触摸设备
  const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
  document.body.classList.toggle("touch", isTouch);

  // ---------- 启动 ----------
  resetSnake();
  placeFood();
  resize();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
